
name: Deploy Test Manager to AWS Lambda

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Python 3.14
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      # 3. Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          mkdir -p package
          pip install \
            --no-compile \
            --target package \
            -r requirements.txt

      # 4. Package application and dependencies
      - name: Create deployment package
        run: |
          cp -r app package/
          cd package
          zip -qr ../deployment.zip .

      # 5. Configure AWS authentication using OIDC
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # 6. Verify AWS identity
      - name: Verify AWS credentials
        run: |
          aws sts get-caller-identity

      # 7. Deploy application
      - name: Deploy to AWS Lambda
        run: |
          aws lambda update-function-code \
            --function-name "${{ vars.LAMBDA_FUNCTION_NAME }}" \
            --zip-file fileb://deployment.zip

      # 8. Wait for deployment
      - name: Wait for Lambda update
        run: |
          aws lambda wait function-updated-v2 \
            --function-name "${{ vars.LAMBDA_FUNCTION_NAME }}"

      - name: Deployment completed
        run: echo "Test Manager deployed successfully!"
